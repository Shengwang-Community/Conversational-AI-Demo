name: Repository Policy

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'dev/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Sensitive information
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head commit: $head_sha" >&2
            exit 1
          fi
          git cat-file -e "${head_sha}^{commit}"

          zero_sha="0000000000000000000000000000000000000000"
          if [[ "$base_sha" == "$zero_sha" || ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base_sha="$(git merge-base "$head_sha" "refs/remotes/origin/$DEFAULT_BRANCH" || true)"
          fi

          if [[ -n "$base_sha" ]]; then
            revision="$base_sha..$head_sha"
          else
            revision="$head_sha"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Scan commits with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --verbose --config=.gitleaks.toml --log-opts=${{ steps.commits.outputs.revision }} .

      - name: Create Gitleaks regression fixtures
        run: |
          set -euo pipefail
          mkdir -p .gitleaks-fixtures/positive/Web .gitleaks-fixtures/positive/Android/app .gitleaks-fixtures/negative

          sample_id="0123456789abcdef"
          sample_id="${sample_id}fedcba9876543210"
          zero_id="0000000000000000"
          zero_id="${zero_id}${zero_id}"

          printf 'static let AppId: String = "%s"\n' "$sample_id" > .gitleaks-fixtures/positive/swift-app-id.swift
          printf 'static NSString * const APPID = @"%s";\n' "$sample_id" > .gitleaks-fixtures/positive/objc-app-id.m
          printf 'static NSString * const Certificate = @"%s";\n' "$sample_id" > .gitleaks-fixtures/positive/objc-certificate.m
          printf '#define APP_ID "%s"\n' "$sample_id" > .gitleaks-fixtures/positive/windows-app-id.h
          printf 'AGORA_APP_CERT=%s\n' "$sample_id" > .gitleaks-fixtures/positive/android-certificate.properties
          printf 'NEXT_PUBLIC_AGORA_APP_ID=%s\n' "$sample_id" > .gitleaks-fixtures/positive/Web/web.env
          printf '{"appId": "%s"}\n' "$sample_id" > .gitleaks-fixtures/positive/Web/config.json
          printf 'AG_APP_ID=%s\n' "$sample_id" > .gitleaks-fixtures/positive/README.md
          printf 'AG_APP_ID = "%s"\n' "$sample_id" > .gitleaks-fixtures/positive/Android/app/build.gradle
          printf 'static let AppId: String = "%s"\n' "$zero_id" > .gitleaks-fixtures/negative/zero-app-id.swift
          printf 'NEXT_PUBLIC_AGORA_APP_ID=%s\n' "$zero_id" > .gitleaks-fixtures/negative/zero-web.env
          printf '\u4e2d\u6587\u8bf4\u660e\n' > .gitleaks-fixtures/negative/README.md

      - name: Scan representative credential formats
        id: credential-formats
        continue-on-error: true
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --no-banner --redact --config=.gitleaks.toml --report-format=json --report-path=.gitleaks-positive.json .gitleaks-fixtures/positive

      - name: Verify representative credentials were detected
        env:
          SCAN_OUTCOME: ${{ steps.credential-formats.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          expected = {
              "swift-app-id.swift",
              "objc-app-id.m",
              "objc-certificate.m",
              "windows-app-id.h",
              "android-certificate.properties",
              "web.env",
              "config.json",
              "README.md",
              "build.gradle",
          }
          report_path = Path(".gitleaks-positive.json")
          findings = json.loads(report_path.read_text()) if report_path.exists() else []
          detected = {Path(item["File"]).name for item in findings}
          missing = expected - detected
          if os.environ["SCAN_OUTCOME"] != "failure" or missing:
              print(f"Gitleaks regression failed; missing detections: {sorted(missing)}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Verify placeholders and localized text are allowed
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir --no-banner --redact --config=.gitleaks.toml .gitleaks-fixtures/negative

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head commit: $head_sha" >&2
            exit 1
          fi
          git cat-file -e "${head_sha}^{commit}"

          zero_sha="0000000000000000000000000000000000000000"
          if [[ "$base_sha" == "$zero_sha" || ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base_sha="$(git merge-base "$head_sha" "refs/remotes/origin/$DEFAULT_BRANCH" || true)"
          fi

          if [[ -n "$base_sha" ]]; then
            revision="$base_sha..$head_sha"
          else
            revision="$head_sha"
          fi

          message_file="$RUNNER_TEMP/commit-message.txt"
          failed=0
          while IFS= read -r commit_sha; do
            git show -s --format=%B "$commit_sha" > "$message_file"
            if ! .git-hooks/check-commit-message.sh "$message_file"; then
              echo "Commit $commit_sha has an invalid message." >&2
              failed=1
            fi
          done < <(git rev-list --reverse "$revision")
          exit "$failed"

  workflow-integrity:
    name: Workflow integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check platform configuration and test wiring
        run: python3 scripts/check_workflow.py
      - name: Test validation scripts
        run: python3 -m unittest discover -s scripts/tests -v
