plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
}

android {
    namespace 'io.agora.scene.convoai'
    compileSdk rootProject.ext.compileSdkVersion
    resourcePrefix "cov_"

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':common')
    implementation project(':scenes:convoai:iot')
    implementation libs.agora.agent.client.toolkit
    implementation libs.spatius.avatar
    implementation libs.spatius.avatar.rtc
    implementation libs.androidx.window
    
    // CameraX dependencies
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view
    
    // Third-party date time picker library
    implementation(libs.datetime.picker) {
        // Kotlin 2.2's Parcelize runtime already contains these legacy parcel classes.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
    }
    // AvatarKit exposes Guava only at runtime; CameraX needs ListenableFuture at compile time.
    implementation 'com.google.guava:guava:33.5.0-android'
    
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
